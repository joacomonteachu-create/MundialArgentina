<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario - Entrada Mundial Argentina</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="pagina">

        <h1>Entrada Mundial Argentina</h1>
        <p>Completa el formulario para reservar tu entrada para el partido de Argentina</p>

        <form action="#" method="POST" id="registroForm">

            <!-- DATOS PERSONALES -->
            <fieldset>
                <legend>Datos personales</legend>

                <div>
                    <label for="nombre">Nombre y Apellido:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Escribe aquí..." required>
                </div>

                <div>
                    <label for="dni">DNI:</label>
                    <input type="tel" id="dni" name="dni" placeholder="Escribe aquí..." required>
                </div>

                <div>
                    <label for="birth">Fecha de nacimiento:</label>
                    <input type="date" id="birth" name="birth" required>
                </div>

                <div>
                    <label for="tel">Teléfono:</label>
                    <input type="tel" name="tel" id="tel" placeholder="Ej: 11 1234-5678" maxlength="12" required>
                </div>

                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Ej: name@mail.com" required>
                </div>
            </fieldset>

            <!-- INFORMACION DEL PARTIDO -->
            <fieldset>
                <legend>Informacion del partido</legend>

                <div>
                    <label for="curso">Partido:</label>
                    <select name="curso" id="curso" required>
                        <option value="">Selecciona el partido</option>
                        <option value="ARG-MEX">Argentina vs México</option>
                        <option value="ARG-BRA">Argentina vs Brasil</option>
                        <option value="ARG-ESP">Argentina vs España</option>
                        <option value="ARG-FRA">Argentina vs Francia</option>
                        <option value="ARG-URU">Argentina vs Uruguay</option>
                    </select>
                </div>

                <div>
                    <label>Tipo de entrada:</label>
                    <div>
                        <label>
                            <input type="radio" name="tipo_entrada" value="general" required>
                            Entrada General
                        </label>

                        <label>
                            <input type="radio" name="tipo_entrada" value="preferencial">
                            Entrada Preferencial
                        </label>

                        <label>
                            <input type="radio" name="tipo_entrada" value="vip">
                            Entrada VIP
                        </label>
                    </div>
                </div>

                <div>
                    <label>Sector de la cancha:</label>
                    <div>
                        <label>
                            <input type="checkbox" name="sector" value="popular">
                            Popular
                        </label>

                        <label>
                            <input type="checkbox" name="sector" value="platea">
                            Platea
                        </label>

                        <label>
                            <input type="checkbox" name="sector" value="preferencial">
                            Preferencial
                        </label>

                        <label>
                            <input type="checkbox" name="sector" value="vip">
                            VIP
                        </label>
                    </div>
                </div>

                <div>
                    <label for="comentarios">Mensaje para la Selección:</label>
                    <textarea name="comentarios" id="comentarios" rows="4" placeholder="Escribí un mensaje para la Selección Argentina..."></textarea>
                </div>
            </fieldset>

            <!-- DATOS DE COMPRA -->
            <fieldset>
                <legend>Datos de compra</legend>

                <div>
                    <label for="password">Número de tarjeta:</label>
                    <input type="password" name="password" id="password" placeholder="Ingresá tu número de tarjeta" minlength="8" required>
                </div>

                <div>
                    <label for="confirmPassword">Código de seguridad:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Código de 3 o 4 dígitos" minlength="3" maxlength="4" required>
                </div>
            </fieldset>

            <!-- TERMINOS Y BOTONES -->
            <div>
                <label>
                    <input type="checkbox" name="termycond" required>
                    Acepto los <a href="#">términos y condiciones</a> *
                </label>
            </div>

            <div>
                <label>
                    <input type="checkbox" id="robot" required>
                    No soy un robot
                </label>
            </div>

            <div>
                <button type="submit">Comprar entrada</button>
                <button type="reset">Limpiar formulario</button>
            </div>

        </form>

    </div>

</body>

</html>
